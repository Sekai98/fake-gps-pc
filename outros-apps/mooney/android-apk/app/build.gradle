plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.stepinjector'
    compileSdk 35           // health-connect-client 1.1.0-alpha11 exige 35

    defaultConfig {
        applicationId "com.stepinjector"
        minSdk 28           // Android 10, requisito mínimo do Health Connect
        targetSdk 34        // comportamento Android 14 (mais estável)
        versionCode 8
        versionName "0.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "StepTracker-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.6'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha11'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
