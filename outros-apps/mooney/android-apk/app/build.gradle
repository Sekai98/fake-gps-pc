plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.stepinjector'
    compileSdk 35           // v0.1.1: necessário pra health-connect-client 1.1.0-alpha11

    defaultConfig {
        applicationId "com.stepinjector"
        minSdk 28           // Android 10, requisito mínimo do Health Connect
        targetSdk 34        // mantém comportamento Android 14 (mais estável que 15)
        versionCode 3
        versionName "0.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }

    // Nome do APK gerado inclui versionName pra separar binarios baixados.
    // Resultado: StepTracker-0.1.0-debug.apk em vez de app-debug.apk.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "StepTracker-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha11'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
