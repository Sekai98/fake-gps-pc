plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.stepinjector.xposed'
    compileSdk 35

    defaultConfig {
        applicationId "com.stepinjector.xposed"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.4.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "PedometerHook-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // Xposed API: compileOnly porque fica provido pelo LSPosed em runtime
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
