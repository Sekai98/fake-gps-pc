name: Android APK Build

# Compila APK debug toda vez que push ou tag.
# Baixar o APK: GitHub -> Actions -> run ultimo -> Artifacts -> fake-gps-apk.zip

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-apk/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android-apk/**'
  workflow_dispatch: # permite trigger manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (pre-instalado no runner Ubuntu)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-apk
          path: android-apk/app/build/outputs/apk/debug/*.apk
          retention-days: 30
