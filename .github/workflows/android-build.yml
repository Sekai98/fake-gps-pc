name: Android APK Build

# Compila APK debug toda vez que push ou tag.
# Baixar o APK: GitHub -> Actions -> run ultimo -> Artifacts -> fake-gps-apk.zip

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-apk/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android-apk/**'
  workflow_dispatch: # permite trigger manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: android-apk
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            # Primeira execucao: cria wrapper via gradle instalado
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Build debug APK
        working-directory: android-apk
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fake-gps-apk
          path: android-apk/app/build/outputs/apk/debug/*.apk
          retention-days: 30
