plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fakegps'
    compileSdk 34

    defaultConfig {
        applicationId "com.fakegps"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "0.2.0-alpha7"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }

    // Nome do APK gerado inclui versionName pra separar os binarios baixados.
    // Resultado: FakeGPS-0.2.0-alpha7-debug.apk em vez de app-debug.apk.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "FakeGPS-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
