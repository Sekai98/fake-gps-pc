<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2029;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #1a73e8;
      --ok: #0f9d58;
      --warn: #f9ab00;
      --err: #e53935;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px;
      width: 280px;
      font-size: 13px;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted);
    }
    .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .dot.off { background: var(--err); }

    .toggle-btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      font-family: inherit;
      transition: background 0.15s ease;
    }
    .toggle-btn.on {
      background: var(--err);
      color: white;
    }
    .toggle-btn.on:hover { background: #ff5a4a; }
    .toggle-btn.off {
      background: var(--ok);
      color: white;
    }
    .toggle-btn.off:hover { background: #0bb964; }

    .panel {
      background: var(--panel);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .row { display: flex; justify-content: space-between; margin: 4px 0; }
    .label { color: var(--muted); }
    .value { font-family: 'Consolas', monospace; font-size: 12px; }
    .help {
      font-size: 11px; color: var(--muted); line-height: 1.5;
      padding: 8px; background: rgba(26, 115, 232, 0.1);
      border-left: 2px solid var(--accent); border-radius: 3px;
    }
    .help b { color: var(--text); }
    code {
      background: rgba(255,255,255,0.08); padding: 1px 4px;
      border-radius: 3px; font-size: 11px;
    }
  </style>
</head>
<body>
  <h1><span id="statusDot" class="dot"></span> Fake GPS PC</h1>

  <button id="toggleBtn" class="toggle-btn off">▶ Ligar Fake GPS</button>

  <div class="panel">
    <div class="row"><span class="label">Fake GPS:</span>
      <span class="value" id="enabledStatus">—</span></div>
    <div class="row"><span class="label">Inject ativo:</span>
      <span class="value" id="status">verificando...</span></div>
    <div class="row"><span class="label">Lat:</span>
      <span class="value" id="lat">-</span></div>
    <div class="row"><span class="label">Lon:</span>
      <span class="value" id="lon">-</span></div>
    <div class="row"><span class="label">Versao:</span>
      <span class="value">0.1.11.6</span></div>
  </div>

  <div class="help">
    <b>Desligar</b> faz o site usar o GPS real do navegador (ou vazio no desktop).
    Reload a aba apos trocar o estado pra garantir efeito total.
  </div>

  <script src="popup.js"></script>
</body>
</html>
